<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MCP CAD Studio</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0c0f14;
        --panel: rgba(20, 25, 33, 0.94);
        --panel-2: #181e28;
        --line: rgba(255, 255, 255, 0.09);
        --muted: #8993a5;
        --text: #f5f7fb;
        --accent: #6ee7b7;
        --accent-2: #60a5fa;
        --danger: #fb7185;
        --radius: 14px;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--text); }
      button, input, select, textarea { font: inherit; }
      button { color: inherit; }

      .shell {
        height: 100vh;
        min-height: 560px;
        display: grid;
        grid-template-rows: 58px 1fr 28px;
        background:
          radial-gradient(circle at 60% -20%, rgba(96, 165, 250, 0.11), transparent 38%),
          var(--bg);
      }

      .topbar {
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 0 16px;
        border-bottom: 1px solid var(--line);
        background: rgba(12, 15, 20, 0.86);
        backdrop-filter: blur(18px);
        z-index: 3;
      }

      .brand { display: flex; align-items: center; gap: 10px; min-width: 184px; }
      .brand-mark {
        width: 30px; height: 30px; display: grid; place-items: center;
        border-radius: 9px; color: #08100d; font-weight: 900;
        background: linear-gradient(145deg, #a7f3d0, #34d399);
        box-shadow: 0 0 28px rgba(52, 211, 153, 0.24);
      }
      .brand strong { display: block; font-size: 13px; letter-spacing: .02em; }
      .brand span { display: block; color: var(--muted); font-size: 10px; margin-top: 1px; }

      .toolbar { display: flex; align-items: center; gap: 7px; flex: 1; }
      .toolbar-separator { width: 1px; height: 26px; background: var(--line); margin: 0 4px; }
      .button, .select, .input {
        border: 1px solid var(--line);
        background: rgba(255,255,255,.045);
        border-radius: 9px;
        min-height: 34px;
      }
      .button {
        display: inline-flex; align-items: center; justify-content: center; gap: 6px;
        padding: 0 11px; cursor: pointer; font-size: 12px; font-weight: 650;
        transition: background .15s, border-color .15s, transform .15s;
      }
      .button:hover { background: rgba(255,255,255,.085); border-color: rgba(255,255,255,.16); }
      .button:active { transform: translateY(1px); }
      .button:disabled { opacity: .45; cursor: wait; }
      .button.primary { background: var(--accent); color: #06100c; border-color: transparent; }
      .button.primary:hover { background: #8aefc8; }
      .button.danger { color: #fecdd3; }
      .button.icon { width: 34px; padding: 0; font-size: 16px; }
      .select, .input { color: var(--text); padding: 0 10px; outline: none; font-size: 12px; }
      .select option { background: #151a22; }

      .workspace { min-height: 0; display: grid; grid-template-columns: 224px minmax(320px, 1fr) 290px; }
      .sidebar, .inspector { min-height: 0; background: var(--panel); backdrop-filter: blur(16px); z-index: 2; }
      .sidebar { border-right: 1px solid var(--line); }
      .inspector { border-left: 1px solid var(--line); overflow-y: auto; }
      .panel-head {
        height: 43px; display: flex; align-items: center; justify-content: space-between;
        padding: 0 13px; border-bottom: 1px solid var(--line);
        color: #d7dce6; font-size: 11px; font-weight: 750; letter-spacing: .09em; text-transform: uppercase;
      }
      .count { color: var(--muted); font-size: 10px; font-weight: 600; }
      .model-list { padding: 8px; display: flex; flex-direction: column; gap: 3px; overflow-y: auto; max-height: calc(100% - 44px); }
      .model-row {
        width: 100%; border: 1px solid transparent; border-radius: 10px; background: transparent;
        display: grid; grid-template-columns: 22px 1fr auto; gap: 7px; align-items: center;
        padding: 8px; color: var(--text); cursor: pointer; text-align: left;
      }
      .model-row:hover { background: rgba(255,255,255,.045); }
      .model-row.active { background: rgba(110,231,183,.09); border-color: rgba(110,231,183,.2); }
      .swatch { width: 19px; height: 19px; border-radius: 6px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.25); }
      .model-copy { min-width: 0; }
      .model-copy strong { display: block; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .model-copy small { display: block; color: var(--muted); font-size: 9px; margin-top: 2px; text-transform: uppercase; letter-spacing: .06em; }
      .revision { color: #5f6b7d; font-size: 9px; }

      .viewport-wrap { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
      #viewport { width: 100%; height: 100%; display: block; outline: none; }
      .view-actions { position: absolute; top: 12px; right: 12px; display: flex; gap: 5px; }
      .view-actions .button { background: rgba(15,19,25,.78); backdrop-filter: blur(8px); }
      .empty-state {
        position: absolute; inset: 0; display: none; place-items: center; pointer-events: none;
      }
      .empty-state.visible { display: grid; }
      .empty-card { text-align: center; color: var(--muted); max-width: 260px; }
      .empty-card .cube { font-size: 44px; color: #3c4657; }
      .empty-card h2 { color: #d4dae5; font-size: 16px; margin: 10px 0 5px; }
      .empty-card p { margin: 0; font-size: 12px; line-height: 1.5; }

      .section { padding: 13px; border-bottom: 1px solid var(--line); }
      .section-title { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .09em; font-weight: 750; margin: 0 0 10px; }
      .field { margin-bottom: 10px; }
      .field:last-child { margin-bottom: 0; }
      .field label { display: block; color: #aab2c0; font-size: 10px; margin: 0 0 5px; }
      .field .input, .field .select { width: 100%; }
      .color-row { display: grid; grid-template-columns: 36px 1fr; gap: 7px; }
      input[type="color"] { width: 36px; height: 34px; padding: 3px; border: 1px solid var(--line); background: transparent; border-radius: 9px; }
      .triplet { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
      .triplet .input { min-width: 0; width: 100%; padding: 0 6px; }
      .triplet-labels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; color: #647084; font-size: 9px; margin-bottom: 4px; }
      .json-editor {
        display: block; width: 100%; height: 190px; resize: vertical; color: #c7d2fe;
        border: 1px solid var(--line); background: #0c1119; border-radius: 9px; padding: 9px;
        font: 10px/1.55 "SFMono-Regular", Consolas, monospace; outline: none; tab-size: 2;
      }
      .json-editor:focus { border-color: rgba(96,165,250,.45); }
      .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
      .actions .button.wide { grid-column: 1 / -1; }

      .statusbar {
        display: flex; align-items: center; justify-content: space-between; gap: 16px;
        padding: 0 11px; border-top: 1px solid var(--line); color: var(--muted); background: #0a0d12;
        font-size: 9px; letter-spacing: .02em;
      }
      .status-left, .status-right { display: flex; align-items: center; gap: 13px; min-width: 0; }
      #status-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #fbbf24; box-shadow: 0 0 8px currentColor; }
      .status-dot.connected { background: var(--accent); }
      .status-dot.error { background: var(--danger); }

      .toast {
        position: absolute; left: 50%; bottom: 16px; transform: translate(-50%, 18px);
        opacity: 0; pointer-events: none; background: rgba(17,23,32,.95); border: 1px solid var(--line);
        border-radius: 10px; padding: 9px 13px; font-size: 11px; color: #e8ecf4;
        box-shadow: 0 16px 40px rgba(0,0,0,.35); transition: .2s; z-index: 6;
      }
      .toast.visible { opacity: 1; transform: translate(-50%, 0); }
      .toast.error { border-color: rgba(251,113,133,.35); color: #fecdd3; }
      #file-input { display: none; }

      @media (max-width: 850px) {
        .workspace { grid-template-columns: 176px minmax(280px, 1fr); }
        .inspector { position: absolute; right: 0; top: 58px; bottom: 28px; width: 280px; transform: translateX(100%); transition: transform .2s; }
        .inspector.open { transform: translateX(0); }
        .brand span { display: none; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark">C</div>
          <div><strong>CAD Studio</strong><span>Parametric MCP workspace</span></div>
        </div>
        <div class="toolbar">
          <select id="new-kind" class="select" aria-label="New primitive">
            <option value="box">Box</option><option value="sphere">Sphere</option>
            <option value="cylinder">Cylinder</option><option value="cone">Cone</option>
          </select>
          <button id="new-model" class="button primary">＋ New</button>
          <div class="toolbar-separator"></div>
          <select id="preset-kind" class="select" aria-label="Generate preset">
            <option value="bracket">L bracket</option><option value="pipe">Pipe</option>
            <option value="gear">Gear</option><option value="enclosure">Enclosure</option>
            <option value="bolt">Bolt</option>
          </select>
          <button id="generate-model" class="button">Generate</button>
          <div class="toolbar-separator"></div>
          <button id="import-button" class="button">Import</button>
          <input id="file-input" type="file" accept=".stl,.obj" />
        </div>
        <button id="toggle-inspector" class="button icon" title="Toggle inspector">☷</button>
      </header>

      <main class="workspace">
        <aside class="sidebar">
          <div class="panel-head"><span>Models</span><span id="model-count" class="count">0</span></div>
          <div id="model-list" class="model-list"></div>
        </aside>

        <section class="viewport-wrap">
          <canvas id="viewport" tabindex="0"></canvas>
          <div class="view-actions">
            <button id="fit-view" class="button icon" title="Fit model">⌗</button>
            <button id="wireframe" class="button icon" title="Toggle wireframe">◇</button>
          </div>
          <div id="empty-state" class="empty-state visible">
            <div class="empty-card"><div class="cube">⬡</div><h2>No model selected</h2><p>Create a primitive, generate a preset, or import an STL/OBJ model.</p></div>
          </div>
          <div id="toast" class="toast"></div>
        </section>

        <aside id="inspector" class="inspector">
          <div class="panel-head"><span>Inspector</span><span id="model-kind" class="count">—</span></div>
          <div class="section">
            <p class="section-title">Document</p>
            <div class="field"><label for="model-name">Name</label><input id="model-name" class="input" placeholder="Model name" /></div>
            <div class="field"><label>Color</label><div class="color-row"><input id="model-color" type="color" value="#6ee7b7" /><input id="model-color-text" class="input" value="#6ee7b7" /></div></div>
          </div>
          <div class="section">
            <p class="section-title">Transform increment</p>
            <div class="field"><label>Translation (mm)</label><div class="triplet-labels"><span>X</span><span>Y</span><span>Z</span></div><div class="triplet"><input class="input transform" data-transform="translation" value="0" /><input class="input transform" data-transform="translation" value="0" /><input class="input transform" data-transform="translation" value="0" /></div></div>
            <div class="field"><label>Rotation (degrees)</label><div class="triplet-labels"><span>X</span><span>Y</span><span>Z</span></div><div class="triplet"><input class="input transform" data-transform="rotation" value="0" /><input class="input transform" data-transform="rotation" value="0" /><input class="input transform" data-transform="rotation" value="0" /></div></div>
            <div class="field"><label>Scale</label><div class="triplet-labels"><span>X</span><span>Y</span><span>Z</span></div><div class="triplet"><input class="input transform" data-transform="scale" value="1" /><input class="input transform" data-transform="scale" value="1" /><input class="input transform" data-transform="scale" value="1" /></div></div>
            <button id="apply-transform" class="button" style="width:100%">Apply transform</button>
          </div>
          <div class="section">
            <p class="section-title">Parametric definition</p>
            <textarea id="shape-json" class="json-editor" spellcheck="false" aria-label="Shape JSON"></textarea>
          </div>
          <div class="section actions">
            <button id="save-model" class="button primary wide">Save changes</button>
            <button id="duplicate-model" class="button">Duplicate</button>
            <button id="delete-model" class="button danger">Delete</button>
            <button id="export-stl" class="button">Export STL</button>
            <button id="export-obj" class="button">Export OBJ</button>
          </div>
        </aside>
      </main>

      <footer class="statusbar">
        <div class="status-left"><span id="status-dot" class="status-dot"></span><span id="status-text">Connecting to MCP host…</span></div>
        <div class="status-right"><span id="mesh-stats">—</span><span id="model-volume">—</span></div>
      </footer>
    </div>
